---
- name: Configure DNS server
  hosts: dns
  become: true
  roles:
      - { role: dns, tags: dns }


- ansible.builtin.import_playbook: test_dns.yml

- name: Configurer le résolveur DNS des machines clientes
  hosts: dns_clients
  become: true
  roles:
    - { role: dns-client, tags: dns-client }

- ansible.builtin.import_playbook: test_dns_client.yml

- name: Configurer le reverse proxy Nginx
  hosts: web
  become: true
  roles:
    - { role: nginx, tags: nginx }

- ansible.builtin.import_playbook: test_nginix.yml

- name: Configurer la base de données MySQL
  hosts: db
  become: true
  roles:
    - { role: mysql, tags: mysql }

- ansible.builtin.import_playbook: test_mysql.yml

- name: Déployer l'application Java
  hosts: web
  become: true
  roles:
    - { role: app, tags: app }
- ansible.builtin.import_playbook: test_helpdesk.yml

- name: Créer la base de données Zabbix
  hosts: db
  become: true
  roles:
    - { role: zabbix_db, tags: zabbix-db }

- name: Installer le serveur Zabbix
  hosts: monitor
  become: true
  roles:
    - { role: monitor, tags: monitoring }

- name: Installer l'agent Zabbix sur toutes les machines
  hosts: servers
  become: true
  roles:
    - { role: zabbix-agent, tags: zabbix-agent }

- name: Déployer les métriques Helpdesk
  hosts: web
  become: true
  roles:
    - { role: zabbix_metrics, tags: zabbix-metrics }