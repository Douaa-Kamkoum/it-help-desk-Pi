---
- name: Configure DNS server
  hosts: dns
  become: true
  roles:
    - dns

- ansible.builtin.import_playbook: test_dns.yml

- name: Configurer le résolveur DNS des machines clientes
  hosts: dns_clients
  become: true
  roles:
    - dns-client

- ansible.builtin.import_playbook: test_dns_client.yml

- name: Configurer le reverse proxy Nginx
  hosts: web
  become: true
  roles:
    - nginx

- ansible.builtin.import_playbook: test_nginix.yml

- name: Configurer la base de données MySQL
  hosts: db
  become: true
  roles:
    - mysql
