---
- name: Installer Bind9
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-utils
      - dnsutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configurer les options de Bind9
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: Restart bind9

- name: Déclarer les zones
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: Restart bind9

- name: Installer la zone directe
  ansible.builtin.template:
    src: db.zone_directe.j2
    dest: "/etc/bind/db.{{ project_domain }}"
    owner: root
    group: bind
    mode: "0644"
  notify: Restart bind9

- name: Installer la zone inverse
  ansible.builtin.template:
    src: zone_inverse.j2
    dest: /etc/bind/zone_inverse
    owner: root
    group: bind
    mode: "0644"
  notify: Restart bind9

- name: Valider la configuration et les zones
  ansible.builtin.command: named-checkconf -z
  changed_when: false

- name: Activer et démarrer Bind9
  ansible.builtin.systemd:
    name: named
    enabled: true
    state: started
