---
- name: Créer la base Zabbix
  community.mysql.mysql_db:
    name: "{{ zabbix_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_bin
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root

- name: Créer l'utilisateur Zabbix
  community.mysql.mysql_user:
    name: "{{ zabbix_db_user }}"
    host: "{{ monitoring_server_ip }}"
    password: "{{ vault_zabbix_db_password }}"
    priv: "{{ zabbix_db_name }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root
  no_log: true

- name: Autoriser la création de triggers pour l'import du schéma
  community.mysql.mysql_variables:
    variable: log_bin_trust_function_creators
    value: 1
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root