---
- name: Installer Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Déployer la configuration du reverse proxy
  ansible.builtin.template:
    src: helpdesk.conf.j2
    dest: /etc/nginx/sites-available/helpdesk.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Activer le site helpdesk
  ansible.builtin.file:
    src: /etc/nginx/sites-available/helpdesk.conf
    dest: /etc/nginx/sites-enabled/helpdesk.conf
    state: link
  notify: Reload nginx

- name: Désactiver le site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Vérifier la syntaxe de la configuration Nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Activer et démarrer Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started


