---
- name: Installer MySQL
  ansible.builtin.apt:
    name:
      - mysql-server
      - python3-pymysql
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Faire écouter MySQL sur son adresse privée
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address\s*='
    line: "bind-address = {{ db_server_ip }}"
  notify: Restart mysql

- name: Activer et démarrer MySQL
  ansible.builtin.systemd:
    name: mysql
    enabled: true
    state: started

- name: Appliquer le redémarrage maintenant
  ansible.builtin.meta: flush_handlers

- name: Créer la base de l'application
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root

- name: Créer l'utilisateur de l'application
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    host: "{{ web_server_ip }}"
    password: "{{ vault_db_password }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: root
  no_log: true

- name: Vérifier que MySQL répond sur son adresse privée
  ansible.builtin.wait_for:
    host: "{{ db_server_ip }}"
    port: "{{ db_port }}"
    timeout: 30
