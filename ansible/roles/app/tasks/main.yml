---
- name: Installer Java
  ansible.builtin.apt:
    name: openjdk-21-jre-headless
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Créer le groupe de l'application
  ansible.builtin.group:
    name: "{{ app_user }}"
    system: true

- name: Créer l'utilisateur de l'application
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Créer le dossier de l'application
  ansible.builtin.file:
    path: "{{ app_install_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copier l'application
  ansible.builtin.copy:
    src: "{{ app_jar_src }}"
    dest: "{{ app_install_dir }}/{{ app_jar_name }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart helpdesk

- name: Créer le dossier de configuration
  ansible.builtin.file:
    path: /etc/helpdesk
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Déployer la configuration (connexion à la base)
  ansible.builtin.template:
    src: helpdesk.env.j2
    dest: /etc/helpdesk/helpdesk.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart helpdesk

- name: Installer le service systemd
  ansible.builtin.template:
    src: helpdesk.service.j2
    dest: /etc/systemd/system/helpdesk.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart helpdesk

- name: Activer et démarrer l'application
  ansible.builtin.systemd:
    name: helpdesk
    enabled: true
    state: started
    daemon_reload: true

- name: Attendre que l'application écoute
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ app_port }}"
    timeout: 120

- name: Vérifier que la page de connexion répond
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/login"
    status_code: 200
  register: app_check
  until: app_check.status == 200
  retries: 6
  delay: 10
