name: CI

on:
  push:
    branches: [feature/cicd, develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: application/it-help-desk-java
  GITLEAKS_VERSION: 8.21.2

jobs:
  # ------------------------------------------------------------------
  # 1. Détection de secrets (tout l'historique Git)
  # ------------------------------------------------------------------
  secrets-scan:
    name: Secrets (Gitleaks)
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Gitleaks (une seule fois, mis en cache sur le runner)
        run: |
          TOOLS="$HOME/.cache/ci-tools/gitleaks-${GITLEAKS_VERSION}"
          if [ ! -x "$TOOLS/gitleaks" ]; then
            mkdir -p "$TOOLS"
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C "$TOOLS" gitleaks
          fi
          echo "$TOOLS" >> "$GITHUB_PATH"

      - name: Scanner le dépôt
        run: gitleaks detect --source . --redact --verbose --report-format json --report-path gitleaks-report.json --exit-code 1

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-gitleaks
          path: gitleaks-report.json
          if-no-files-found: ignore