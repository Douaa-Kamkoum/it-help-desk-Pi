name: CI - Helpdesk Application
on:
  push:
    branches: [feature/cicd, develop, main]
  pull_request:
    branches: [develop, main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  APP_DIR: application/it-help-desk-java
  GITLEAKS_VERSION: 8.21.2

jobs:
  # ------------------------------------------------------------------
  # 1. Détection des secrets avec Gitleaks
  # ------------------------------------------------------------------
  secrets-scan:
    name: "🔐 Security - Secret Detection (Gitleaks)"
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout - Récupération du dépôt"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📦 Installation de Gitleaks"
        run: |
          TOOLS="$HOME/.cache/ci-tools/gitleaks-${GITLEAKS_VERSION}"

          if [ ! -x "$TOOLS/gitleaks" ]; then
            echo "Installation de Gitleaks ${GITLEAKS_VERSION}..."
            mkdir -p "$TOOLS"

            curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C "$TOOLS" gitleaks
          else
            echo "Gitleaks est déjà installé."
          fi

          echo "$TOOLS" >> "$GITHUB_PATH"

      - name: "🛡️ Analyse de sécurité du dépôt"
        run: |
          echo "Début de l'analyse des secrets..."

          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1


      - name: "📊 Résultat de l'analyse"
        if: always()
        run: |
          if [ -f gitleaks-report.json ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('gitleaks-report.json'))))")

            echo "Nombre de secrets détectés : $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo "✅ Aucun secret détecté."
            else
              echo "⚠️ Des secrets potentiels ont été détectés."
            fi
          else
            echo "⚠️ Aucun rapport JSON disponible."
          fi
      - name: "📤 Publication du rapport de sécurité"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-securite-gitleaks
          path: gitleaks-report.json
          if-no-files-found: ignore



  # ==================================================================
  # JOB 2 — APPLICATION VALIDATION & QUALITY ANALYSIS
  # ==================================================================
  application-validation:
    name: "Application | Build, Tests & Quality Analysis"
    runs-on: self-hosted
    timeout-minutes: 30
    needs: secrets-scan

    defaults:
      run:
        working-directory: application/it-help-desk-java

    env:
      DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # --------------------------------------------------------------
    # Temporary MySQL database for integration tests
    # --------------------------------------------------------------
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_DATABASE: helpdesk_db
          MYSQL_USER: helpdesk_user
          MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # ------------------------------------------------------------
      # 1. Source code checkout
      # ------------------------------------------------------------
      - name: "1. Checkout | Retrieve source code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Build, tests and coverage
      # ------------------------------------------------------------
      - name: "2. Maven | Build, Unit Tests & Code Coverage"
        run: >
          mvn -B clean
          org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent
          verify
          org.jacoco:jacoco-maven-plugin:0.8.12:report

      # ------------------------------------------------------------
      # 3. SonarCloud configuration validation
      # ------------------------------------------------------------
      - name: "3. SonarCloud | Validate Configuration"
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        env:
          SONAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          missing=0
          [ -z "$SONAR_TOKEN" ] && { echo "::error::Secret SONAR_TOKEN manquant"; missing=1; }
          [ -z "$SONAR_ORG" ] && { echo "::error::Variable SONAR_ORGANIZATION manquante"; missing=1; }
          [ -z "$SONAR_KEY" ] && { echo "::error::Variable SONAR_PROJECT_KEY manquante"; missing=1; }
          exit $missing

      # ------------------------------------------------------------
      # 4. SonarCloud analysis and Quality Gate
      # ------------------------------------------------------------
      - name: "4. SonarCloud | Code Quality & Quality Gate"
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true

      # ------------------------------------------------------------
      # 5. Test and coverage reports
      # ------------------------------------------------------------
      - name: "5. Artifacts | Publish Test & Coverage Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            application/it-help-desk-java/target/surefire-reports/
            application/it-help-desk-java/target/site/jacoco/
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # 6. Application package
      # ------------------------------------------------------------
      - name: "6. Artifacts | Publish Application JAR"
        uses: actions/upload-artifact@v4
        with:
          name: it-helpdesk-application
          path: application/it-help-desk-java/target/ithelpdesk-1.0.0.jar
          if-no-files-found: error



  # ==================================================================
  # 🔐 JOB 3 — DEPENDENCY SECURITY ANALYSIS
  # ==================================================================
  dependency-check:
    name: "🔐 Security | OWASP Dependency-Check"
    runs-on: self-hosted
    timeout-minutes: 60
    needs: application-validation

    # ⚠️ Analyse temporairement non bloquante
    # Une vulnérabilité avec un CVSS >= 9 ne bloque pas encore la pipeline.
    continue-on-error: true

    defaults:
      run:
        working-directory: application/it-help-desk-java

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      # --------------------------------------------------------------
      # 1. 📥 Retrieve source code
      # --------------------------------------------------------------
      - name: "📥 Checkout | Retrieve Source Code"
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # 2. 🔍 Scan dependencies for known vulnerabilities
      # --------------------------------------------------------------
      - name: "🔍 OWASP | Scan Dependencies"
        run: |
          ARGS=(-Dformats=HTML,JSON -DfailBuildOnCVSS=9)

          if [ -n "$NVD_API_KEY" ]; then
            ARGS+=("-DnvdApiKey=$NVD_API_KEY")
          else
            echo "::warning::NVD_API_KEY is not configured. Dependency-Check will use its available NVD access."
          fi

          mvn -B org.owasp:dependency-check-maven:12.1.0:check "${ARGS[@]}"

      # --------------------------------------------------------------
      # 3. 📊 Publish vulnerability analysis reports
      # --------------------------------------------------------------
      - name: "📊 Artifacts | Publish OWASP Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-reports
          path: |
            application/it-help-desk-java/target/dependency-check-report.html
            application/it-help-desk-java/target/dependency-check-report.json
          if-no-files-found: ignore
